name: Bot PR Reviews

# When a pull request contains changes not attributed to a person with write
# access, require one more approval than the base branch's ruleset requires.
# Otherwise a user with write access could have a bot (or another account)
# write the change and approve it themselves, bypassing peer review.
#
# A PR needs the extra approval when any of these lack write access to the
# repository, are bots, or aren't linked to a GitHub account:
#   - the PR author
#   - the author or committer of any commit on the PR
# It also needs the extra approval when any commit lacks a verified signature,
# since an unsigned commit can name anyone as its author and committer.
#
# This generalizes GitHub's "additional approval for unattributed Copilot pull
# requests" ruleset setting to any bot, and also applies it to outside
# contributors.
#
# Requires the ruleset's pull request rule to also enable:
#   - "Dismiss stale pull request approvals when new commits are pushed", so
#     approvals given before a later bot push no longer count.
#   - "Require approval of the most recent reviewable push", so a person who
#     pushes their own commits to someone else's PR can't approve them.
#
# This workflow is run by an org ruleset, which only triggers on the default
# activity types of pull_request (opened, synchronize, reopened) and
# merge_group. Reviews and base branch changes do not re-run this check, so
# after approvals are submitted it must be re-run manually to pass.
# See https://docs.github.com/en/enterprise-server@3.19/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/troubleshooting-rules

on:
    pull_request:
    merge_group:

permissions: {}

# Queue rather than cancel, so the most recent event's result is the one that sticks.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: false

jobs:
    bot-pr-reviews:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: Check approvals
              env:
                  GH_TOKEN: ${{ github.token }}
                  EVENT_NAME: ${{ github.event_name }}
                  REPO: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  set -euo pipefail

                  # PRs can't enter the merge queue without this check passing on the PR.
                  if [[ -z "$PR_NUMBER" ]]; then
                      echo "Not a pull request event ($EVENT_NAME), nothing to check."
                      exit 0
                  fi

                  # Logs are public on public repos, so never log which accounts do or don't have write access.
                  has_write() {
                      case "$(gh api "repos/$REPO/collaborators/$1/permission" --jq .permission 2>/dev/null || echo none)" in
                          admin|write) return 0 ;;
                          *) return 1 ;;
                      esac
                  }

                  # Read the PR live rather than from the event payload, which re-runs reuse and which
                  # goes stale if the base branch is changed.
                  pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
                  PR_AUTHOR=$(jq -r '.user.login' <<< "$pr")
                  PR_AUTHOR_TYPE=$(jq -r '.user.type' <<< "$pr")
                  BASE_REF=$(jq -r '.base.ref' <<< "$pr")

                  commits=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits?per_page=100" | jq -s -c 'add')

                  reasons=()

                  if [[ "$PR_AUTHOR_TYPE" == "Bot" ]]; then
                      reasons+=("PR was opened by a bot")
                  elif ! has_write "$PR_AUTHOR"; then
                      reasons+=("PR was opened by an external contributor")
                  fi

                  # The PR commits API returns at most 250 commits, so a full list can't be fully inspected.
                  if (( $(jq 'length' <<< "$commits") >= 250 )); then
                      reasons+=("PR has 250+ commits, unable to inspect all")
                  fi

                  if jq -e 'any(.[]; .author == null or .committer == null)' <<< "$commits" > /dev/null; then
                      reasons+=("commits authored or committed by an identity not linked to a GitHub account")
                  fi

                  # Without a verified signature, a commit's author and committer can name anyone. The ruleset's
                  # signed commits requirement doesn't cover PR branches when squash merging, as GitHub signs
                  # the squashed commit itself.
                  if jq -e 'any(.[]; .commit.verification.verified != true)' <<< "$commits" > /dev/null; then
                      reasons+=("commits without a verified signature")
                  fi

                  if jq -e 'any(.[]; .author.type? == "Bot" or .committer.type? == "Bot")' <<< "$commits" > /dev/null; then
                      reasons+=("commits authored or committed by a bot")
                  fi

                  # web-flow is the committer GitHub uses for commits made through the web UI or API. GitHub only signs
                  # these when the author is the authenticated user, so the author is trusted for verified commits.
                  commit_accounts=$(jq -r '
                      [.[] | .author, (.committer | select(.login? != "web-flow"))]
                      | map(select(. != null and .type != "Bot") | .login)
                      | unique
                      | .[]' <<< "$commits")
                  while read -r login; do
                      [[ -z "$login" ]] && continue
                      if ! has_write "$login"; then
                          reasons+=("commits authored or committed by an external contributor")
                          break
                      fi
                  done <<< "$commit_accounts"

                  if (( ${#reasons[@]} == 0 )); then
                      echo "No extra approval required."
                      exit 0
                  fi

                  # Highest required approval count across all active pull_request rules on the base branch.
                  ruleset_required=$(gh api --paginate "repos/$REPO/rules/branches/$BASE_REF?per_page=100" \
                      | jq -s '[add[] | select(.type == "pull_request") | .parameters.required_approving_review_count] | max // 0')
                  required=$((ruleset_required + 1))

                  # Latest approve/request-changes/dismiss state per non-bot reviewer, mirroring how GitHub counts reviews.
                  approvers=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" \
                      | jq -s -r --arg author "$PR_AUTHOR" '
                          add
                          | map(select(
                              .user != null
                              and .user.type != "Bot"
                              and .user.login != $author
                              and (.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")))
                          | group_by(.user.login)
                          | map(max_by(.id))
                          | map(select(.state == "APPROVED") | .user.login)
                          | .[]')

                  # Only count approvals from users with write access, as GitHub does.
                  counted=0
                  while read -r login; do
                      [[ -z "$login" ]] && continue
                      if has_write "$login"; then
                          counted=$((counted + 1))
                      fi
                  done <<< "$approvers"

                  {
                      echo "### Bot PR reviews"
                      echo ""
                      echo "PR #$PR_NUMBER requires $required approval(s) from reviewers with write access (the ruleset's $ruleset_required plus one) because:"
                      echo ""
                      for reason in "${reasons[@]}"; do echo "- $reason"; done
                      echo ""
                      echo "Approvals from reviewers with write access: $counted of $required"
                  } >> "$GITHUB_STEP_SUMMARY"

                  if (( counted < required )); then
                      echo "::error::PR requires $required approval(s) from reviewers with write access (the ruleset's $ruleset_required plus one) and has $counted. See the job summary for details. Reviews do not re-run this check, so re-run it after new approvals are submitted."
                      exit 1
                  fi

                  echo "PR has $counted of $required required approval(s) from reviewers with write access."
